name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gen.sh'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.jks ]; then
            keytool -genkeypair -keystore keystore/debug.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Al Volante"
          fi
      - name: Generar proyecto
        run: bash gen.sh
      - name: Compilar APK
        continue-on-error: true
        run: |
          cd proj
          gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
      - name: Publicar resultado
        run: |
          mkdir -p dist
          if [ -f proj/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp proj/app/build/outputs/apk/debug/app-debug.apk dist/al-volante.apk
            echo "OK" > dist/STATUS.txt
          else
            echo "FAIL" > dist/STATUS.txt
          fi
          date -u >> dist/STATUS.txt
          grep -nE "^e: |error:|FAILED|What went wrong|Could not" -A4 build.log | head -150 > dist/ERRORS.txt || true
          tail -n 80 build.log > dist/LOG_TAIL.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist keystore
          git commit -m "Resultado de la compilacion" || true
          git push || true
